<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="HeaderTweaker settings placeholder">
  <rect width="800" height="560" fill="#010A31"/>
  <g font-family="Inter, sans-serif">
    <text x="32" y="56" font-size="24" font-weight="700" fill="#ffffff">Settings</text>
    <line x1="32" y1="88" x2="768" y2="88" stroke="#414362" stroke-width="1"/>

    <rect x="32" y="120" width="736" height="80" rx="8" fill="#0a1550"/>
    <text x="56" y="156" font-size="17" font-weight="600" fill="#ffffff">Enable all modifications</text>
    <text x="56" y="180" font-size="14" fill="#9B9DB1">Turn every header rule on or off at once</text>
    <rect x="688" y="146" width="56" height="30" rx="15" fill="#00D27C"/>
    <circle cx="729" cy="161" r="11" fill="#ffffff"/>

    <rect x="32" y="216" width="736" height="80" rx="8" fill="#0a1550"/>
    <text x="56" y="252" font-size="17" font-weight="600" fill="#ffffff">Import configuration</text>
    <text x="56" y="276" font-size="14" fill="#9B9DB1">Load rules from a JSON file</text>
    <rect x="620" y="234" width="124" height="44" rx="22" fill="none" stroke="#872DFA" stroke-width="2"/>
    <text x="682" y="261" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Import</text>

    <rect x="32" y="312" width="736" height="80" rx="8" fill="#0a1550"/>
    <text x="56" y="348" font-size="17" font-weight="600" fill="#ffffff">Export configuration</text>
    <text x="56" y="372" font-size="14" fill="#9B9DB1">Download all rules as JSON</text>
    <rect x="620" y="330" width="124" height="44" rx="22" fill="none" stroke="#872DFA" stroke-width="2"/>
    <text x="682" y="357" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Export</text>

    <text x="32" y="524" font-size="13" fill="#9B9DB1">All configuration is stored locally in your browser</text>
  </g>
</svg>
